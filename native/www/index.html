<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lookout</title>
    <style>
      :root { color-scheme: light; }
      html, body { height: 100%; margin: 0; }
      body {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #2f4a38;
        color: #f4efe4;
        padding: 24px;
      }
      main { max-width: 22rem; text-align: center; }
      svg { width: 72px; height: 72px; }
      h1 { font-family: Georgia, "Iowan Old Style", serif; font-weight: 500; font-size: 2.4rem; margin: 16px 0 8px; letter-spacing: -0.03em; }
      p { margin: 0; line-height: 1.5; color: rgba(244, 239, 228, 0.8); font-size: 0.95rem; }
      button {
        margin-top: 24px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #f4efe4;
        color: #2f4a38;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#f4efe4" />
        <polygon points="16,2.2 7.6,11.8 24.4,11.8" fill="#2f4a38"/>
        <rect x="10.6" y="11.8" width="10.8" height="5.8" fill="#2f4a38"/>
        <rect x="14" y="13.2" width="4" height="3" fill="#f4efe4"/>
        <rect x="8.2" y="17.4" width="15.6" height="1.3" fill="#2f4a38"/>
        <rect x="11.4" y="18.6" width="2.2" height="3.2" fill="#2f4a38"/>
        <rect x="18.4" y="18.6" width="2.2" height="3.2" fill="#2f4a38"/>
        <rect x="8" y="20.8" width="8.8" height="4" rx="0.5" fill="#2f4a38"/>
        <rect x="10.2" y="21.6" width="4.2" height="2.2" fill="#f4efe4"/>
        <rect x="7.2" y="24.4" width="17.6" height="3.8" rx="0.7" fill="#2f4a38"/>
        <circle cx="11.2" cy="28.4" r="1.85" fill="#1a1915"/>
        <circle cx="20.8" cy="28.4" r="1.85" fill="#1a1915"/>
      </svg>
      <h1>Lookout</h1>
      <p>Connecting to the park gate. If this stays up, the live Lookout address is not in the app yet.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
